# Standard post-processing PPP-static baseline.
# Input observation/navigation/SP3/CLK files are passed on the command line.
# This configuration does not enable PPP-B2b corrections.

pos1-posmode      =ppp-static
pos1-frequency    =l1+2
pos1-soltype      =forward
pos1-elmask       =10
pos1-dynamics     =off
pos1-tidecorr     =on
pos1-ionoopt      =dual-freq
pos1-tropopt      =est-ztd
pos1-sateph       =precise
pos1-posopt1      =on
pos1-posopt2      =on
pos1-posopt3      =precise
pos1-posopt4      =on
pos1-posopt5      =off
pos1-posopt6      =off
pos1-navsys       =33

pos2-armode       =off
pos2-gloarmode    =off
pos2-bdsarmode    =off

out-solformat     =llh
out-outhead       =on
out-outopt        =on
out-outvel        =off
out-timesys       =gpst
out-timeform      =hms
out-timendec      =3
out-degform       =deg
out-outsingle     =off
out-maxsolstd     =0
out-height        =ellipsoidal
out-geoid         =internal
out-solstatic     =all
out-outstat       =off
